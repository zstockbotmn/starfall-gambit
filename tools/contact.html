<body><canvas id="gl"></canvas><div id="tag"></div>

  for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) { const i = r * 6 + c, alt = (r + c) % 2; const m = neb.includes(i) ? M.nebula : r < 3 ? M['tileR' + alt] : M['tileB' + alt];

  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(.62, .66, .06, 64), id[0] === 'r' ? M.tileR0 : M.tileB0); plinth.position.y = -.12; plinth.receiveShadow = true; scene.add(plinth);

  if (s === 'r') for (const [c, x] of [[0xff2bd6, -1.2], [0x19f0ff, 1.2]]) { const p = new THREE.PointLight(c, 3, 4, 2); p.position.set(x, .9, .6); scene.add(p); }
  camera.fov = 24; camera.position.set(0, 1.5, 6.6); camera.lookAt(0, 0, 0); tag = (s === 'b' ? 'BLUE UTOPIA FLEET' : 'RED CYBERPUNK FLEET') + ' · play-view LOD1 GLBs'; }

  const L = { 0: 'rS', 1: 'rL', 2: 'rD', 3: 'rF', 4: 'rL', 5: 'rS', 30: 'bS', 31: 'bL', 32: 'bD', 33: 'bF', 34: 'bL', 35: 'bS' };
